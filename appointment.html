<section class="appointment">
<h1>Book an Appointment</h1>
<form id="appointmentForm">
<input type="text" id="name" placeholder="Patient Name" required>
<input type="number" id="age" placeholder="Age" required>
<input type="tel" id="phone" placeholder="Mobile Number" required>
<input type="email" id="email" placeholder="Email Address" required>

<select id="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<select id="doctor" required>
<option value="">Select Doctor</option>
<option>Dr.  raja kumar</option>
<option>Dr. himanshu shivam</option>
<option>Dr. shashikant Kumar</option>
</select>

<input type="date" id="date" required>
<input type="time" id="time" required>
<textarea id="problem" rows="5" placeholder="Describe Your Problem"></textarea>
<button type="submit">Book Appointment</button>

</form>
</section>
